[package]
name = "cargo-internal-checks"
version = "0.1.3"
edition = "2024"
description = "Checks and fixes team-wide Rust source-layout conventions"

[[bin]]
name = "cargo-internal-checks"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.23.1"
clap = { version = "4.6", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display"] }
itertools = "0.15.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "3.0", features = ["extra-traits", "full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["chrono", "env-filter", "parking_lot"] }
walkdir = "2.5"


[lints.rust]
# This one may vary depending on the project.
unsafe_code = "forbid"

# LINEBENDER LINT RUST SET - Cargo.toml - v6.1
# See https://linebender.org/wiki/canonical-lints/
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"

elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
# END LINEBENDER LINT RUST SET

[lints.clippy]
# LINEBENDER LINT CLIPPY SET - Cargo.toml - v6.1
too_many_arguments = "allow"

allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"

negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
# END LINEBENDER LINT CLIPPY SET

single_match = "warn"
single_match_else = "warn"
needless_match = "warn"
needless_late_init = "warn"
redundant_pattern_matching = "warn"
redundant_pattern = "warn"
redundant_guards = "warn"
collapsible_match = "warn"
match_single_binding = "warn"
match_same_arms = "warn"
match_ref_pats = "warn"
match_bool = "warn"
needless_bool = "deny"
unwrap_used = "warn"
expect_used = "warn"
